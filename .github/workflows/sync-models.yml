name: Sync free models

on:
  schedule:
    - cron: '23 3 * * *'  # 每日 UTC 03:23，避开整点
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-models
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/sync-free-models.mjs
      - run: node scripts/sync-paid-models.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/free-models.json src/data/pricing.json src/data/paid-models.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: daily models sync"
          git push
